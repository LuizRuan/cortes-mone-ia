services:
  cortes:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${CORTES_PORT:-7860}:7860"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORTES_GROQ_WHISPER: ${CORTES_GROQ_WHISPER:-whisper-large-v3-turbo}
      CORTES_GROQ_LLM: ${CORTES_GROQ_LLM:-openai/gpt-oss-120b}
      CORTES_LLM_MODEL: ${CORTES_LLM_MODEL:-claude-sonnet-5-5}
      TZ: America/Sao_Paulo
    volumes:
      - type: bind
        source: ${CORTES_INPUT_DIR:-./entrada}
        target: /entrada
        read_only: true
      - ./saida:/app/saida
      - ./videos_do_drive:/app/videos_do_drive
      - modelos:/home/app/.cache
      - transcricoes:/cache
      - uploads:/uploads
      - studio:/studio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  modelos:
  transcricoes:
  uploads:
  studio:
